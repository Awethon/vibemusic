[package]
name = "vibemusic-relay"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
ab_glyph = { version = "0.2", features = ["variable-fonts"] }
base64 = "0.22"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
imageproc = { version = "0.25", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# The WebSocket client for the end-to-end tests in main.rs. axum already builds this crate, with
# the same version and features, so it adds no compile time.
tokio-tungstenite = "0.29"

[profile.dev.package."*"]
opt-level = 2

# The cover test draws a real 1200 px cover. Blur, resize and JPEG code from `image` and `imageproc`
# is generic, so it is compiled as part of this crate and the override above does not reach it:
# unoptimised, that one test took 13 s.
[profile.test]
opt-level = 2
