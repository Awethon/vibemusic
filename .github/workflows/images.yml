# Builds the app and relay images for amd64 and arm64 (each on its own native runner) and
# publishes them to GitHub's container registry:
#   push to main  -> :edge and :sha-<commit>
#   tag vX.Y.Z    -> :X.Y.Z, :X.Y and :latest, plus a GitHub release with generated notes
name: Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Image names must be lowercase, and the account name isn't; compose.yaml uses the same names.
env:
  REGISTRY: ghcr.io/awethon

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: vibemusic, context: app }
          - { name: vibemusic-relay, context: relay }
        arch:
          - { platform: linux/amd64, runner: ubuntu-24.04, slug: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, slug: arm64 }
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image.name }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          platforms: ${{ matrix.arch.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.arch.slug }}
      - run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image.context }}-${{ matrix.arch.slug }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { name: vibemusic, context: app }
          - { name: vibemusic-relay, context: relay }
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          # Named by folder: digests-vibemusic-* would also match the relay's digests-vibemusic-relay-*.
          pattern: digests-${{ matrix.context }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ matrix.name }}@sha256:%s ' *)
      - run: docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ matrix.name }}:${{ steps.meta.outputs.version }}"

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
